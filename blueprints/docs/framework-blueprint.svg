<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background-color:#ffffff; font-family:-apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.08" />
    </filter>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6" />
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d946ef" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981" />
    </marker>
  </defs>

  <!-- "You" Box -->
  <rect x="300" y="30" width="200" height="60" rx="30" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2" />
  <text x="400" y="65" text-anchor="middle" font-weight="600" font-size="18" fill="#111827">👤 You (Human Vision)</text>

  <!-- Konductor Logic Box -->
  <rect x="150" y="150" width="220" height="80" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
  <text x="260" y="185" text-anchor="middle" font-weight="bold" font-size="18" fill="#1e40af">Konductor Framework</text>
  <text x="260" y="210" text-anchor="middle" font-size="14" fill="#3b82f6">(Context &amp; Rules Engine)</text>

  <!-- AI Agents Box -->
  <rect x="430" y="150" width="220" height="80" rx="8" fill="#fdf4ff" stroke="#d946ef" stroke-width="2" filter="url(#shadow)" />
  <text x="540" y="185" text-anchor="middle" font-weight="bold" font-size="18" fill="#86198f">AI Coding Assistants</text>
  <text x="540" y="210" text-anchor="middle" font-size="14" fill="#d946ef">(Claude, Cursor, AI Tools)</text>

  <!-- The Codebase / Monorepo Container -->
  <rect x="50" y="300" width="700" height="170" rx="12" fill="#fafafa" stroke="#e5e7eb" stroke-width="3" stroke-dasharray="8 4" />
  <text x="400" y="330" text-anchor="middle" font-weight="bold" font-size="20" fill="#4b5563">Your Local Project Repository</text>

  <!-- Inside Repo: Memory Vault -->
  <rect x="80" y="360" width="280" height="80" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2" filter="url(#shadow)" />
  <text x="220" y="385" text-anchor="middle" font-weight="bold" font-size="16" fill="#065f46">.konductor/ Memory Vault</text>
  <text x="220" y="410" text-anchor="middle" font-size="13" fill="#059669">ADR History • Rule Contracts • Roadmap</text>

  <!-- Inside Repo: Codebase -->
  <rect x="390" y="360" width="330" height="80" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2" filter="url(#shadow)" />
  <text x="555" y="385" text-anchor="middle" font-weight="bold" font-size="16" fill="#374151">Application Code &amp; CI/CD</text>
  <text x="555" y="410" text-anchor="middle" font-size="13" fill="#6b7280">Web, Mobile APIs, Database, Tests</text>

  <!-- Arrows -->
  
  <!-- You to Konductor (Roadmap) -->
  <path d="M 360 90 L 260 143" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead-gray)" />
  <text x="260" y="115" text-anchor="middle" font-size="13" fill="#4b5563" font-weight="500">Defines Rules</text>

  <!-- You to AI (Tasks) -->
  <path d="M 440 90 L 540 143" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead-gray)" />
  <text x="540" y="115" text-anchor="middle" font-size="13" fill="#4b5563" font-weight="500">Assigns Tasks</text>

  <!-- Konductor to AI (Rules alignment) -->
  <path d="M 370 190 L 420 190" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="4 2" marker-end="url(#arrowhead-blue)" />
  <text x="395" y="180" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="bold">Aligns</text>

  <!-- AI to Repo (Writes Code) -->
  <path d="M 540 230 L 555 350" fill="none" stroke="#d946ef" stroke-width="2.5" marker-end="url(#arrowhead-purple)" />
  <text x="615" y="275" text-anchor="middle" font-size="13" fill="#86198f" font-weight="600">Writes &amp; Tests Code</text>

  <!-- Repo to Konductor (Reads state) -->
  <path d="M 220 350 L 260 238" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowhead-green)" />
  <text x="160" y="295" text-anchor="middle" font-size="13" fill="#065f46" font-weight="600">Feeds Context Map</text>

</svg>
